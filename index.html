    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
  }

    color: #fff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 12px;
    overflow-x: hidden;
  }
  header {
    text-align: center;
    margin-bottom: 10px;
  }
  h1 {
    font-size: 1.6rem;
    color: #ffd13b;
    text-shadow: 2px 2px 0 #000, 0 0 10px rgba(255, 209, 59, 0.5);

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

  .subtitle {
    font-size: 0.85rem;
    color: #00f0ff;
    letter-spacing: 0.5px;
  }
  #game-wrapper {
    position: relative;
    max-width: 960px;
    width: 100%;
    background: #000;
    border: 3px solid #00f0ff;

    box-shadow: 0 8px 30px rgba(0, 240, 255, 0.25), 0 0 0 2px #ff334b;

  }

    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;

  #hud-top {

  .xp-pill {
    color: #ffd13b;

<script>
// --- 1. Sound Synthesizer via Web Audio API ---
class SoundFX {
  constructor() {
    this.ctx = null;
    this.enabled = true;
    this.lastClimbStep = 0;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
  }
  playTone(freq, type, dur, gainVal=0.15) {
    if (!this.enabled || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + dur);
    } catch(e) {}
  }
  jump(isDouble=false) {
    if (!this.enabled || !this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = isDouble ? 'sine' : 'square';
      const startF = isDouble ? 280 : 160;
      const endF = isDouble ? 520 : 380;
      osc.frequency.setValueAtTime(startF, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(endF, this.ctx.currentTime + 0.14);
      gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.14);
    } catch(e) {}
  }
  climb() {
    const now = Date.now();
    if (now - this.lastClimbStep > 170) {
      this.playTone(220, 'triangle', 0.05, 0.08);
      this.lastClimbStep = now;
    }
  }
  correct() {
    if (!this.enabled) return;
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
      setTimeout(() => this.playTone(f, 'sine', 0.25, 0.16), i * 65);
    });
  }
  wrong() {
    if (!this.enabled) return;
    this.playTone(180, 'sawtooth', 0.3, 0.18);
    setTimeout(() => this.playTone(130, 'sawtooth', 0.35, 0.18), 120);
  }
}
const sfx = new SoundFX();

// Touch setup
function bindTouch(btnId, keyName) {
  const el = document.getElementById(btnId);
  const press = e => { e.preventDefault(); sfx.init(); keys[keyName] = true; };
  const release = e => { e.preventDefault(); keys[keyName] = false; };
  el.addEventListener('touchstart', press);
  el.addEventListener('touchend', release);
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
}

function generateQuestion() {
  const sel = document.getElementById('sifir-choice').value;
  let n1 = 7;
  if (sel === 'all') {
    n1 = Math.floor(Math.random() * 11) + 2; // 2 to 12
  } else {
    n1 = parseInt(sel, 10);
  }
  const n2 = Math.floor(Math.random() * 10) + 1; // 1 to 10
  const ans = n1 * n2;
  currentQuestion = { num1: n1, num2: n2, ans: ans, text: `${n1} × ${n2}` };

  document.getElementById('quest-display').textContent = `SOALAN SIFIR: ${n1} × ${n2} = ?`;

  let choices = [ans];
  while (choices.length < 4) {
    const offset = (Math.random() < 0.5 ? 1 : -1) * (n1 * (Math.floor(Math.random() * 2) + 1));
    let cand = ans + offset;
    if (cand <= 0 || choices.includes(cand)) {
      cand = ans + (Math.floor(Math.random() * 10) - 5);
      if (cand <= 0) cand = ans + choices.length * 2;
    }
    if (!choices.includes(cand)) choices.push(cand);
  }
  choices.sort(() => Math.random() - 0.5);

  answerOrbs = orbSlots.map((pos, i) => ({
    x: pos.x,
    y: pos.y,
    r: 28,
    val: choices[i],
    isCorrect: choices[i] === ans,
    bobOffset: Math.random() * Math.PI * 2,
    collected: false
  }));
}

document.getElementById('sifir-choice').addEventListener('change', () => {
  generateQuestion();
});

// --- 6. Particle FX ---
function spawnParticles(x, y, color, count=18) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 1.5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1.5,
      life: 1.0,
      decay: Math.random() * 0.035 + 0.02,
      color,
      size: Math.random() * 5 + 3
    });
  }
}

function spawnJumpPuff(x, y) {
  for (let i = 0; i < 8; i++) {
    jumpPuffParticles.push({
      x: x + (Math.random() * 16 - 8),
      y: y,
      vx: (Math.random() - 0.5) * 3,
      vy: (Math.random() * -1.5) - 0.5,
      life: 0.6,
      decay: 0.04,
      size: Math.random() * 4 + 3
    });
  }
}

// --- 7. Pixel Art Procedural Drawing ---
function drawPixelAdventurer(ctx, p) {
  ctx.save();
  ctx.translate(Math.round(p.x), Math.round(p.y));

  if (p.isClimbing) {
    // Back view while climbing the wooden ladder rungs!
    const rungStep = Math.sin(p.animTimer * 12) * 5;
    // Backpack in center
    ctx.fillStyle = '#8b5a2b';
    ctx.fillRect(8, 14, 16, 18);
    ctx.fillStyle = '#d4a373';
    ctx.fillRect(10, 16, 12, 6);

    // Hands reaching up ladder rungs
    ctx.fillStyle = '#fed7aa';
    ctx.fillRect(2, 6 + rungStep, 6, 8);
    ctx.fillRect(24, 6 - rungStep, 6, 8);

    // Boots climbing
    ctx.fillStyle = '#4a3728';
    ctx.fillRect(6, 34 - rungStep, 8, 12);
    ctx.fillRect(18, 34 + rungStep, 8, 12);

    // Back of head & spiky brown hair
    ctx.fillStyle = '#5c3a21';
    ctx.fillRect(6, 0, 20, 12);
    ctx.fillStyle = '#ff334b'; // Scarf knot
    ctx.fillRect(10, 11, 12, 4);

    ctx.restore();
    return;
  }

  if (p.facing === -1) {
    ctx.scale(-1, 1);
    ctx.translate(-p.w, 0);
  }

  const isMoving = Math.abs(p.vx) > 0.2 && p.isGrounded;
  const legSwing = isMoving ? Math.sin(p.animTimer * 10) * 5 : 0;

  // Backpack (Brown)
  ctx.fillStyle = '#8b5a2b';
  ctx.fillRect(-4, 14, 8, 18);
  ctx.fillStyle = '#d4a373';
  ctx.fillRect(-2, 16, 4, 6);

  // Boots / Legs
  ctx.fillStyle = '#4a3728';
  ctx.fillRect(4, 34 + legSwing, 9, 12);
  ctx.fillRect(17, 34 - legSwing, 9, 12);

  // Torso / Tunic
  ctx.fillStyle = '#1e3a8a';
  ctx.fillRect(4, 16, 22, 18);
  ctx.fillStyle = '#ffd13b'; // Belt
  ctx.fillRect(4, 30, 22, 4);

  // Scarf
  ctx.fillStyle = '#ff334b';
  ctx.fillRect(2, 12, 26, 6);

  // Face / Skin
  ctx.fillStyle = '#fed7aa';
  ctx.fillRect(6, 4, 18, 12);

  // Eye
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(18, 8, 3, 4);

  // Hair
  ctx.fillStyle = '#5c3a21';
  ctx.fillRect(4, 0, 22, 6);
  ctx.fillRect(2, 2, 6, 8);

  ctx.restore();
}

function drawOrb(ctx, orb, time) {
  const bob = Math.sin(time * 3 + orb.bobOffset) * 6;
  const cx = orb.x;
  const cy = orb.y + bob;

  // Glowing Aura
  const grad = ctx.createRadialGradient(cx, cy, 6, cx, cy, orb.r + 14);
  grad.addColorStop(0, 'rgba(0, 240, 255, 0.85)');
  grad.addColorStop(0.5, 'rgba(168, 85, 247, 0.4)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, orb.r + 14, 0, Math.PI * 2);
  ctx.fill();

  // Crystal Body
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = '#090e24';
  ctx.strokeStyle = '#ffd13b';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(-orb.r, -orb.r, orb.r * 2, orb.r * 2, 12);
  ctx.fill();
  ctx.stroke();

  // Answer Text
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 20px "Segoe UI", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(orb.val, 0, 1);
  ctx.restore();
}

// Draw Ladder Visual Highlight & Climbing Prompt
function drawLadderOverlay(ctx, ladder, nearPlayer) {
  if (nearPlayer) {
    // Subtle pulsating cyan glow around ladder
    ctx.save();
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(ladder.x - 4, ladder.y - 2, ladder.w + 8, ladder.h + 4);
    ctx.setLineDash([]);

    // Floating prompt badge above ladder / player
    if (!player.isClimbing) {
      const px = ladder.x + ladder.w / 2;
      const py = Math.min(player.y - 18, ladder.y + ladder.h - 10);
      ctx.fillStyle = 'rgba(9, 14, 36, 0.9)';
      ctx.strokeStyle = '#ffd13b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(px - 65, py - 18, 130, 26, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#ffd13b';
      ctx.font = 'bold 12px "Segoe UI", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('▲ TEKAN W/UP', px, py - 5);
    }
    ctx.restore();
  }
}

// --- 8. Update & Game Loop ---
let lastTime = 0;
let jumpKeyWasDown = false;

function update(dt) {
  // 1. Ladder Check
  player.nearLadder = null;
  const pFootX = player.x + player.w / 2;
  const pFootY = player.y + player.h;

  for (const lad of ladders) {
    if (
      pFootX >= lad.x - 12 &&
      pFootX <= lad.x + lad.w + 12 &&
      player.y + player.h >= lad.y &&
      player.y <= lad.y + lad.h + 20
    ) {
      player.nearLadder = lad;
      break;
    }
  }

  // 2. Ladder Climbing State Transition
  if (player.nearLadder) {
    if (keys.up || keys.down) {
      player.isClimbing = true;
      player.vx = 0;
      // Center player on ladder
      player.x = player.nearLadder.x + player.nearLadder.w / 2 - player.w / 2;
    }
  } else {
    player.isClimbing = false;
  }

  // 3. Movement Physics (Climbing vs Walking/Jumping)
  if (player.isClimbing) {
    player.vy = 0;
    if (keys.up) {
      player.vy = -player.climbSpeed;
      sfx.climb();
      player.animTimer += dt;
      // Step off at top
      if (player.y + player.h <= player.nearLadder.topY + 6) {
        player.y = player.nearLadder.topY - player.h;
        player.isClimbing = false;
        player.isGrounded = true;
        player.jumpCount = 0;
      }
    } else if (keys.down) {
      player.vy = player.climbSpeed;
      sfx.climb();
      player.animTimer += dt;
      // Step off at bottom
      if (player.y + player.h >= player.nearLadder.bottomY) {
        player.y = player.nearLadder.bottomY - player.h;
        player.isClimbing = false;
        player.isGrounded = true;
        player.jumpCount = 0;
      }
    }

    // Dismount or Jump off ladder
    if (keys.jump && !jumpKeyWasDown) {
      player.isClimbing = false;
      player.vy = player.jumpPower * 0.9;
      player.vx = (keys.left ? -player.speed : (keys.right ? player.speed : 0));
      sfx.jump();
      player.jumpCount = 1;
    }

    // Lateral move on ladder
    if (keys.left) player.x -= 1.8;
    if (keys.right) player.x += 1.8;

    player.y += player.vy;

  } else {
    // Normal Platformer Movement
    if (keys.left) {
      player.vx = -player.speed;
      player.facing = -1;
    } else if (keys.right) {
      player.vx = player.speed;
      player.facing = 1;
    } else {
      player.vx *= 0.74; // Friction
      if (Math.abs(player.vx) < 0.1) player.vx = 0;
    }

    // Jump & Double Jump (*Lompat Berganda*)
    if (keys.jump && !jumpKeyWasDown) {
      if (player.isGrounded) {
        // First Jump
        player.vy = player.jumpPower;
        player.isGrounded = false;
        player.jumpCount = 1;
        sfx.jump(false);
        spawnJumpPuff(player.x + player.w/2, player.y + player.h);
      } else if (player.jumpCount === 1) {
        // Double Jump!
        player.vy = player.jumpPower * 0.92;
        player.jumpCount = 2;
        sfx.jump(true);
        spawnJumpPuff(player.x + player.w/2, player.y + player.h);
        spawnParticles(player.x + player.w/2, player.y + player.h, '#00f0ff', 12);
      }
    }

    // Gravity
    player.vy += player.gravity;

    // Move X
    player.x += player.vx;
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

    // Move Y & Collision
    player.y += player.vy;
    player.isGrounded = false;

    for (const plat of platforms) {
      if (
        player.x + player.w > plat.x + 4 &&
        player.x < plat.x + plat.w - 4 &&
        player.y + player.h >= plat.y &&
        player.y + player.h <= plat.y + 16 &&
        player.vy >= 0
      ) {
        player.y = plat.y - player.h;
        player.vy = 0;
        player.isGrounded = true;
        player.jumpCount = 0;
        break;
      }
    }

    player.animTimer += dt;
  }

  jumpKeyWasDown = keys.jump;

  // Fall off reset
  if (player.y > canvas.height + 60) {
    player.x = 100;
    player.y = 410;
    player.vy = 0;
    player.isClimbing = false;
    hearts = Math.max(0, hearts - 1);
    updateHearts();
    sfx.wrong();
    if (hearts <= 0) restartGame();
  }

  // Check collision with Answer Orbs
  const pcx = player.x + player.w / 2;
  const pcy = player.y + player.h / 2;
  for (const orb of answerOrbs) {
    const dist = Math.hypot(pcx - orb.x, pcy - orb.y);
    if (dist < orb.r + 20) {
      if (orb.isCorrect) {
        score += 100;
        streak += 1;
        sfx.correct();
        spawnParticles(orb.x, orb.y, '#ffd13b', 28);
        spawnParticles(orb.x, orb.y, '#00f0ff', 20);
        feedbackText = `TAHNIAH! ${currentQuestion.text} = ${orb.val} ✓ (+100 XP)`;
        feedbackColor = '#ffd13b';
        feedbackTimer = 2.0;
        document.getElementById('score-display').textContent = `⭐ SKOR: ${score} XP (Streak: ${streak}🔥)`;
        generateQuestion();
      } else {
        hearts = Math.max(0, hearts - 1);
        streak = 0;
        updateHearts();
        sfx.wrong();
        spawnParticles(orb.x, orb.y, '#ff334b', 20);
        feedbackText = `CUBA LAGI! Petua: ${currentQuestion.text} = ${currentQuestion.ans}`;
        feedbackColor = '#ff334b';
        feedbackTimer = 2.5;
        player.vx = player.facing * -6;
        player.vy = -5;
        player.isClimbing = false;
        if (hearts <= 0) restartGame();
      }
      break;
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = jumpPuffParticles.length - 1; i >= 0; i--) {
    const p = jumpPuffParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) jumpPuffParticles.splice(i, 1);
  }

  if (feedbackTimer > 0) feedbackTimer -= dt;
}

function updateHearts() {
  let hStr = '';
  for (let i = 0; i < 3; i++) hStr += (i < hearts ? '❤' : '🖤');
  document.getElementById('hearts-display').textContent = hStr;
}

function restartGame() {
  hearts = 3;
  score = 0;
  streak = 0;
  updateHearts();
  document.getElementById('score-display').textContent = '⭐ SKOR: 0 XP (Streak: 0🔥)';
  feedbackText = 'PERMAINAN DITERUSKAN! PILIH JAWAPAN DENGAN TELITI';
  feedbackColor = '#00f0ff';
  feedbackTimer = 2.5;
  player.x = 100;
  player.y = 410;
  player.isClimbing = false;
  generateQuestion();
}

function draw(time) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Draw 16-Bit Base64 Background
  if (bgImage.complete && bgImage.naturalWidth > 0) {
    ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.fillStyle = '#090e24';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // 2. Draw Ladder Highlight / Prompt
  ladders.forEach(lad => {
    const isNear = player.nearLadder && player.nearLadder.id === lad.id;
    drawLadderOverlay(ctx, lad, isNear);
  });

  // 3. Draw Answer Orbs
  answerOrbs.forEach(orb => drawOrb(ctx, orb, time));

  // 4. Draw Player
  drawPixelAdventurer(ctx, player);

  // 5. Draw Particles
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
  jumpPuffParticles.forEach(p => {
    ctx.fillStyle = '#ffffff';
    ctx.globalAlpha = Math.max(0, p.life * 0.7);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1.0;

  // 6. Draw Feedback Banner
  if (feedbackTimer > 0) {
    ctx.save();
    ctx.fillStyle = 'rgba(9, 14, 36, 0.92)';
    ctx.strokeStyle = feedbackColor;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(canvas.width / 2 - 280, 22, 560, 48, 14);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = feedbackColor;
    ctx.font = 'bold 20px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(feedbackText, canvas.width / 2, 46);
    ctx.restore();
  }
}

function loop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
  lastTime = timestamp;
  update(dt);
  draw(timestamp / 1000);
  requestAnimationFrame(loop);
}

// Start
generateQuestion();
updateHearts();
requestAnimationFrame(loop);
</script>
